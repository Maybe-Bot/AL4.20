# Long experiment intended for approximately 24 hours on a laptop-class CPU.
# Actual duration depends on population growth and the host processor. Run the
# small configuration first, and adjust tick_count after measuring throughput.
seed = 20260401

input_size = 8
hidden_size = 24
communication_size = 2
initial_population = 2
capacity_bytes = 67108864

# Use slower population growth than the development configuration.
maturity_age = 5000
reproduction_ramp_ticks = 45000
courtship_duration_ticks = 20
awake_age_rate = 1.0
sleep_age_rate = 0.6
off_age_rate = 0.02
max_without_awake_days = 7
reproduction_base_probability = 0.0001
reproduction_max_probability = 0.02

mutation_probability = 0.01
mutation_magnitude = 0.08
plasticity_limit = 0.025
plasticity_decay = 0.9995
max_abs_weight = 4.0

# This run spans 250 simulated days and therefore exercises April 1 state rules.
calendar_start_year = 2026
calendar_start_month = 1
calendar_start_day = 1
ticks_per_day = 4000
tick_count = 1000000
# Seed genomes contain a mutable recurrent sleep rhythm. This threshold only
# gates neural transition requests; it does not set a sleep schedule.
foolsday_sleep_death_probability = 0.0
off_min_duration_ticks = 100
off_max_duration_ticks = 100000
state_transition_threshold = 0.5

# Reproduction-attempt and plasticity events are disabled at this level.
summary_interval = 10000
checkpoint_interval = 100000
checkpoint_path = long-24h.chk
event_log_path = long-24h-events.jsonl
logging_level = summary
