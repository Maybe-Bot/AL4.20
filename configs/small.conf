# Small deterministic experiment for development and inspection.
seed = 4202026

# The fixed network stays near 1,000 mutable parameters with these sizes.
input_size = 8
hidden_size = 24
communication_size = 2
initial_population = 2

# Limit the living population by its measured memory footprint.
capacity_bytes = 26214400

# Reproduction opportunity rises linearly from the base to the maximum.
maturity_age = 50
reproduction_ramp_ticks = 450
reproduction_base_probability = 0.01
reproduction_max_probability = 0.25

mutation_probability = 0.001
mutation_magnitude = 0.10
plasticity_limit = 0.05
plasticity_decay = 0.999
max_abs_weight = 4.0

# Simulate 20 January days during this short run.
calendar_start_year = 2026
calendar_start_month = 3
calendar_start_day = 29
ticks_per_day = 1000
tick_count = 20000
april_1_behavior = terminate

summary_interval = 100
checkpoint_interval = 1000
checkpoint_path = small.chk
event_log_path = small-events.jsonl
logging_level = events
