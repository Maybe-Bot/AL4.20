name: C build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build with strict warnings
        run: make all

      - name: Run invariant tests
        run: make test

      - name: Run sanitizer tests
        run: make sanitize
